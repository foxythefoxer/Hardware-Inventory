## apcupsd.conf fixture — the shape of a real one, none of a real one's host.
## Only UPSCABLE, UPSTYPE and DEVICE are whitelisted by the collector; every
## other key here exists to prove that, the same way var.ini's csrf_token does.
UPSNAME fixture-ups
UPSCABLE usb
UPSTYPE usb
DEVICE
NISPASSWD CANARY_APCUPSD_MUST_NOT_LEAK
EVENTSFILE /var/log/apcupsd.events
SCRIPTDIR /etc/apcupsd
